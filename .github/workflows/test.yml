name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The plugin wraps the real `codegraph` CLI; install it so the harness
      # exercises the actual binary on PATH.
      - name: Install codegraph CLI
        run: npm install -g @colbymchenry/codegraph

      # @deepseek-ai/dsh-tools, dsh-llm, schemastery (+ runtime peers
      # cordis/dsh-scope/dsh-invariants) are peerDependencies of the plugin,
      # provided by the DSH harness in production. Source-direct loads (CI,
      # dev includes) must install them locally: they are pinned as
      # devDependencies in package.json (versions matching the current
      # harness), so `npm ci` replays the lockfile instead of the old
      # ad-hoc --no-save hack that missed dsh-llm.
      - name: Install plugin dev/peer dependencies
        run: npm ci --legacy-peer-deps

      - name: Run plugin test harness
        run: node test/run-plugin-test.mjs
